spring:
  datasource:
    url: jdbc:h2:mem:aeronex;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: aeronex-disruption-audit
      auto-offset-reset: earliest
    listener:
      auto-startup: false

aeronex:
  outbox:
    relay:
      enabled: false
