spring:
  application:
    name: aeronex

  datasource:
    url: jdbc:postgresql://localhost:5432/aeronex
    username: aeronex
    password: aeronex
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: aeronex-disruption-audit
      auto-offset-reset: earliest
    listener:
      ack-mode: manual_immediate

aeronex:
  outbox:
    relay:
      enabled: true

server:
  port: 8080
