# Development-grade single-broker Kafka (KRaft mode), matching the kafka
# service in docker-compose.yml exactly (same image, same broker config, same
# two listeners). Not HA — a single dev broker, not a production cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  replicas: 1
  # Same reasoning as postgres-deployment.yaml: a single ReadWriteOnce PVC
  # requires the old pod to fully terminate before a replacement starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 29092
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            # Two listeners, same as docker-compose.yml: PLAINTEXT for other pods
            # in the cluster (advertised as the Service name "kafka"),
            # PLAINTEXT_HOST retained for parity but not reachable from outside
            # the cluster network — no NodePort/LoadBalancer is created for it.
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            # Broker and controller are the same process on this single-node
            # deployment, so the self-registration RPC never needs to leave the
            # pod. Routing it through the "kafka" Service's ClusterIP instead of
            # localhost hits a hairpin NAT path kind's default CNI doesn't
            # reliably support, which made the broker time out registering with
            # itself and crash-loop. docker-compose.yml doesn't hit this: its
            # embedded DNS resolves a container's own hostname with no NAT
            # involved, so the equivalent "kafka:29093" there just works.
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:29093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            # Fixed cluster ID (not a secret — an opaque cluster identifier),
            # identical to docker-compose.yml, so the KRaft storage format stays
            # consistent across restarts against the same volume.
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          # KRaft self-registration can take noticeably longer inside a kind
          # node than under native Docker Compose. A startupProbe defers
          # readiness/liveness evaluation until bootstrap actually finishes, so
          # a slow-but-healthy startup is never mistaken for a hung process and
          # killed mid-registration.
          startupProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-data
