# ClusterIP (the default type) — reachable only from inside the cluster.
# Deliberately no NodePort/LoadBalancer: Kafka must not be exposed externally.
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 29092
      targetPort: 29092
    - name: plaintext-host
      port: 9092
      targetPort: 9092
